  # ========== Chat (USER_CS / USER_MERCHANT) ==========
  /after-sales/{afterSaleId}/chat/thread:
    post:
      tags: [chat]
      summary: 用户开聊或获取已有 USER_CS 会话（幂等）
      description: |
        已有 OPEN 直接返回。新建仅当售后为 ESCALATED（请先申请平台介入）。
      security:
        - bearerAuth: []
      parameters:
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已有会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '201':
          description: 新建会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '403':
          description: 非本人售后
        '404':
          description: 售后不存在
        '409':
          description: 售后未升级，不允许新建客服会话

  /after-sales/{afterSaleId}/merchant-chat/thread:
    post:
      tags: [chat]
      summary: 开聊或获取已有售后 USER_MERCHANT 会话（幂等）
      description: |
        用户对本人售后开聊；商家对本店售后开聊/取会话。
        已有 OPEN 会话直接返回。用户新建允许 APPLIED/REJECTED/APPROVED/RETURNING；
        商家可在 APPLIED/APPROVED/RETURNING/REJECTED/ESCALATED/REFUNDED 新建或进入。
      security:
        - bearerAuth: []
      parameters:
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已有会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '201':
          description: 新建会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '403':
          description: 非本人/非本店售后
        '404':
          description: 售后不存在
        '409':
          description: 当前售后状态不允许新建商家会话

  /orders/{orderId}/merchant-chat/thread:
    post:
      tags: [chat]
      summary: 开聊或获取订单级 USER_MERCHANT 会话（幂等）
      description: |
        用于待发货等履约前沟通（改规格/颜色、催发货等）。
        请求体传 merchantId 或 subOrderId；同一 orderId+merchantId 至多一条 OPEN。
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          description: 非本人售后
        '404':
          description: 售后不存在

  /merchant/after-sales/{afterSaleId}/chat/thread:
    post:
      tags: [chat]
      summary: 商家开聊或获取本店售后的 USER_MERCHANT 会话（幂等）
      security:
        - bearerAuth: []
      parameters:
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: integer
                subOrderId:
                  type: integer
              description: merchantId 与 subOrderId 至少传一个
      responses:
        '200':
          description: 已有会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '201':
          description: 新建会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '403':
          description: 非本人订单或非目标店铺
        '404':
          description: 订单/子单不存在
        '409':
          description: 当前订单状态不允许联系商家
          description: 非本店售后
        '404':
          description: 售后不存在

  /chat/threads:
    get:
      tags: [chat]
      summary: 会话列表
      description: |
        用户：本人会话（可按 type 过滤）；
        商家：本店 USER_MERCHANT；
        CS_AGENT/SUPER_ADMIN：USER_CS 全部。
      description: 用户仅见自己的 USER_CS；商家仅见本店 USER_MERCHANT；CS_AGENT/SUPER_ADMIN 仅见全部 USER_CS
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, CLOSED]
        - name: type
          in: query
          description: 不传则按角色默认（用户=全部类型，商家=USER_MERCHANT，客服=USER_CS）
          schema:
            type: string
            enum: [USER_CS, USER_MERCHANT]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatThread'

  /chat/threads/{threadId}/messages:
    get:
      tags: [chat]
      summary: 拉取消息（支持 afterId 增量轮询）
      security:
        - bearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
        - name: afterId
          in: query
          schema:
            type: integer
          description: 仅返回 id 大于 afterId 的消息
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
    post:
      tags: [chat]
      summary: 发送文字或订单卡片
      security:
        - bearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'

  /chat/threads/{threadId}/close:
    post:
      tags: [chat]
      summary: 主动关闭会话
      description: |
        用户/商家/客服关闭本人有权访问的 OPEN 会话。
        另：售后进入 REFUNDED/REJECTED 时系统自动关闭关联会话；
        平台仲裁同意退货（APPROVED）时关闭 USER_CS；
        订单取消或整单退款时关闭订单级商家会话。
      security:
        - bearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 已关闭（或本来已关闭）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThread'
        '403':
          description: 无权操作
        '404':
          description: 会话不存在

  /chat/threads/{threadId}/actions/{actionKey}:
    post:
      tags: [chat]
      summary: 客服或商家快捷动作
      description: |
        客服（USER_CS）：CS_APPROVE / CS_REJECT → arbitrate；HINT_RETURN → SYSTEM 文案。
        商家（USER_MERCHANT）：MERCHANT_APPROVE / MERCHANT_REJECT → merchant after-sale audit，并写 SYSTEM 消息。
      security:
        - bearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
        - name: actionKey
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ChatActionKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/ChatMessage'
                  afterSale:
                    type: object
                    description: 动作影响售后时返回

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatThread:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [USER_CS, USER_MERCHANT]
        afterSaleId:
          type: integer
          nullable: true
          description: 售后会话必填；订单级沟通可空
        orderId:
          type: integer
        orderNo:
          type: string
        userId:
          type: integer
        merchantId:
          type: integer
          nullable: true
          description: USER_MERCHANT 时必有；USER_CS 可空
        shopName:
          type: string
          nullable: true
          description: USER_MERCHANT 会话由关联售后单解析的所属商家
        status:
          type: string
          enum: [OPEN, CLOSED]
        afterSaleStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        threadId:
          type: integer
        senderType:
          type: string
          enum: [USER, CS_AGENT, MERCHANT, SYSTEM]
          enum: [USER, MERCHANT, CS_AGENT, SYSTEM]
        senderId:
          type: integer
          nullable: true
        msgType:
          type: string
          enum: [TEXT, CARD, QUICK_ACTION]
        content:
          type: string
        payload:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    SendChatMessageRequest:
      type: object
      required: [msgType]
      properties:
        msgType:
          type: string
          enum: [TEXT, CARD]
        content:
          type: string
          description: TEXT 时必填
        payload:
          type: object
          description: CARD 时可传自定义摘要；省略则服务端按售后生成

    ChatActionKey:
      type: string
      enum:
        - CS_APPROVE
        - CS_REJECT
        - HINT_RETURN
        - MERCHANT_APPROVE
        - MERCHANT_REJECT

    UserRegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password

    UserLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
        nickname:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: 头像 URL（可为空）

    UserProfile:
      type: object
      properties:
        userId:
          type: integer
        phone:
          type: string
        nickname:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: 头像 URL（可为空）

    FavoriteItem:
      type: object
      properties:
        favoriteId:
          type: integer
        spuId:
          type: integer
        title:
          type: string
        mainImage:
          type: string
          nullable: true
        minPrice:
          type: number
          nullable: true
        shopName:
          type: string
          nullable: true
        status:
          type: string
          description: 商品当前状态；下架/不存在时仍可在收藏中展示
        createdAt:
          type: string
          format: date-time

    UpdateUserProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          description: 昵称
        avatarUrl:
          type: string
          nullable: true
          description: |
            头像图片地址。传空字符串可清除头像。
            支持 http(s) URL，或演示用 data:image/*;base64,...（建议 ≤ 200KB）。
        currentPassword:
          type: string
          format: password
          description: 修改密码时必填
        newPassword:
          type: string
          format: password
          description: 新密码，至少 6 位；与 currentPassword 同时提供

    Address:
      type: object
      description: 收货地址（对齐 DOMAIN_MODEL Address）
      properties:
        id:
          type: integer
          description: 地址 ID，下单时作为 addressId
        userId:
          type: integer
        receiverName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
        isDefault:
          type: boolean

    CreateAddressRequest:
      type: object
      required: [receiverName, phone, province, city, district, detail]
      properties:
        receiverName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
        isDefault:
          type: boolean
          default: false

    UpdateAddressRequest:
      type: object
      required: [receiverName, phone, province, city, district, detail]
      properties:
        receiverName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
        isDefault:
          type: boolean

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        adminId:
          type: integer
        role:
          $ref: '#/components/schemas/AdminRole'

    AdminRole:
      type: string
      enum:
        - SUPER_ADMIN
        - OPERATOR
        - CS_AGENT

    AdminStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED

    AdminAccount:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        status:
          $ref: '#/components/schemas/AdminStatus'
        createdAt:
          type: string
          format: date-time

    CreateAdminRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum:
            - OPERATOR
            - CS_AGENT
          description: 不可创建 SUPER_ADMIN

    UpdateAdminRequest:
      type: object
      description: 至少提供 role、status、password 之一；用户名不可改
      properties:
        role:
          type: string
          enum:
            - OPERATOR
            - CS_AGENT
          description: 仅允许运营/客服互切，不可改为 SUPER_ADMIN
        status:
          $ref: '#/components/schemas/AdminStatus'
        password:
          type: string
          format: password
          description: 传入则重置密码；省略则不改

    AuditRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        reason:
          type: string

    ArbitrateRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        reason:
          type: string

    AdminDashboardSummary:
      type: object
      properties:
        pendingProductCount:
          type: integer
          description: 待审核商品数（PENDING_AUDIT）
        escalatedAfterSaleCount:
          type: integer
          description: 待仲裁售后数（ESCALATED）
        pendingMerchantCount:
          type: integer
          description: 待审核商家入驻数
        auditedProductCount:
          type: integer
          description: 累计已审核商品次数
        onShelfProductCount:
          type: integer
          description: 已上架商品数
        rejectedProductCount:
          type: integer
          description: 已驳回商品数
        totalOrderCount:
          type: integer
          description: 全平台订单总数
        pendingPaymentOrderCount:
          type: integer
          description: 待支付订单数
        recentPendingProducts:
          type: array
          items:
            $ref: '#/components/schemas/PendingProductSummary'
        recentPendingMerchants:
          type: array
          items:
            $ref: '#/components/schemas/PendingMerchant'
        recentEscalatedAfterSales:
          type: array
          items:
            $ref: '#/components/schemas/AfterSale'

    ProductAuditRecord:
      type: object
      properties:
        auditId:
          type: integer
        spuId:
          type: integer
        approved:
          type: boolean
        reason:
          type: string
        auditedAt:
          type: string
          format: date-time
        adminId:
          type: integer
        title:
          type: string
        shopName:
          type: string
        merchantId:
          type: integer
        mainImage:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductAuditListResponse:
      type: object
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/ProductAuditRecord'

    PendingProductSummary:
      type: object
      properties:
        spuId:
          type: integer
        title:
          type: string
        shopName:
          type: string
        submittedAt:
          type: string
          format: date-time

    AfterSaleType:
      type: string
      enum:
        - REFUND_ONLY
        - RETURN_REFUND

    AfterSaleStatus:
      type: string
      enum:
        - APPLIED
        - APPROVED
        - REJECTED
        - ESCALATED
        - RETURNING
        - REFUNDED

    CreateAfterSaleRequest:
      type: object
      required: [type, reason, items]
      properties:
        type:
          $ref: '#/components/schemas/AfterSaleType'
        reason:
          type: string
        subOrderId:
          type: integer
          description: 可选；多店铺订单时指定子单。省略则按 items 所属子单推断（items 须同属一个子单）
        items:
          type: array
          minItems: 1
          description: |
            本次售后的商品行。skuId 须属于目标子单；
            本迭代 quantity 须等于该 SKU 剩余可售后数量（整件售后）。
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId:
                type: integer
              quantity:
                type: integer
                minimum: 1

    AfterSaleAuditRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
        reason:
          type: string

    ReturnShipmentRequest:
      type: object
      required: [logisticsCompany, trackingNo]
      properties:
        logisticsCompany:
          type: string
        trackingNo:
          type: string

    ReturnShipment:
      type: object
      properties:
        logisticsCompany:
          type: string
        trackingNo:
          type: string
        shippedAt:
          type: string
          format: date-time

    AfterSale:
      type: object
      properties:
        afterSaleId:
          type: integer
        orderId:
          type: integer
        orderNo:
          type: string
        subOrderId:
          type: integer
        merchantId:
          type: integer
        userId:
          type: integer
        shopName:
          type: string
        type:
          $ref: '#/components/schemas/AfterSaleType'
        reason:
          type: string
        status:
          $ref: '#/components/schemas/AfterSaleStatus'
          description: ESCALATED 表示待平台仲裁
        appliedAt:
          type: string
          format: date-time
        merchantDeadline:
          type: string
          format: date-time
        auditReason:
          type: string
        auditedAt:
          type: string
          format: date-time
        returnShipment:
          $ref: '#/components/schemas/ReturnShipment'
          description: 用户寄回物流；RETURNING/REFUNDED 时可能有值
        items:
          type: array
          items:
            type: object
            properties:
              skuId:
                type: integer
              title:
                type: string
              price:
                type: number
              quantity:
                type: integer

    AfterSaleListResponse:
      type: object
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/AfterSale'

    PendingProductListResponse:
      type: object
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            type: object
            properties:
              spuId:
                type: integer
              title:
                type: string
              shopName:
                type: string
              merchantId:
                type: integer
              mainImage:
                type: string
              submittedAt:
                type: string
                format: date-time

    PendingMerchant:
      type: object
      properties:
        merchantId:
          type: integer
          description: 申请 ID
        shopName:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        appliedAt:
          type: string
          format: date-time

    MerchantApplicationSubmitRequest:
      type: object
      required: [shopName, contactName, contactPhone]
      properties:
        shopName:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string

    MerchantApplication:
      allOf:
        - $ref: '#/components/schemas/PendingMerchant'
        - type: object
          properties:
            status:
              type: string
              enum: [PENDING, APPROVED, REJECTED]
            auditedAt:
              type: string
              format: date-time
            rejectReason:
              type: string
            approvedMerchantId:
              type: integer
            merchantUsername:
              type: string
              description: 审核通过后生成的商家登录账号

    MerchantApplicationListResponse:
      type: object
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/MerchantApplication'

    OrderListResponse:
      type: object
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            subOrders:
              type: array
              items:
                $ref: '#/components/schemas/SubOrder'
            addressSnapshot:
              type: object
              properties:
                receiverName:
                  type: string
                phone:
                  type: string
                fullAddress:
                  type: string

    SubOrder:
      type: object
      properties:
        subOrderId:
          type: integer
        merchantId:
          type: integer
        shopName:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        shipment:
          type: object
          properties:
            logisticsCompany:
              type: string
            trackingNo:
              type: string
            shippedAt:
              type: string
              format: date-time
        autoConfirmDeadline:
          type: string
          format: date-time
          nullable: true
          description: 该子单自动确认收货截止时间（仅 SHIPPED 时有值）
        items:
          type: array
          items:
            type: object
            properties:
              skuId:
                type: integer
              title:
                type: string
              price:
                type: number
              quantity:
                type: integer

    ProductStatus:
      type: string
      enum:
        - DRAFT
        - PENDING_AUDIT
        - ON_SHELF
        - REJECTED
        - OFF_SHELF

    MerchantDashboardSummary:
      type: object
      properties:
        merchantId:
          type: integer
        shopId:
          type: integer
        shopName:
          type: string
        productTotal:
          type: integer
        draftProductCount:
          type: integer
        pendingAuditProductCount:
          type: integer
        onShelfProductCount:
          type: integer
        rejectedProductCount:
          type: integer
        offShelfProductCount:
          type: integer
        pendingShipmentOrderCount:
          type: integer
        shippedOrderCount:
          type: integer

    MerchantProductListResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          description: 当前页商品列表
          items:
            $ref: '#/components/schemas/MerchantProduct'
        list:
          type: array
          description: 兼容旧调用的当前页商品列表，内容与 items 一致
          items:
            $ref: '#/components/schemas/MerchantProduct'

    MerchantProduct:
      type: object
      properties:
        spuId:
          type: integer
        shopId:
          type: integer
        shopName:
          type: string
        merchantId:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        mainImage:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        submittedAt:
          type: string
          format: date-time
        rejectReason:
          type: string
          description: 平台驳回原因；仅 status=REJECTED 时有值
        skus:
          type: array
          items:
            $ref: '#/components/schemas/MerchantSku'

    MerchantSku:
      type: object
      properties:
        skuId:
          type: integer
        specJson:
          type: object
          additionalProperties:
            type: string
        price:
          type: number
        stock:
          $ref: '#/components/schemas/MerchantStock'

    MerchantStock:
      type: object
      properties:
        available:
          type: integer
          minimum: 0
        locked:
          type: integer
          minimum: 0

    UpdateMerchantSkuStockRequest:
      type: object
      required: [available]
      properties:
        available:
          type: integer
          minimum: 0
          description: 设置 SKU 当前可用库存；不能为负数。

    MerchantSkuStockResponse:
      type: object
      properties:
        skuId:
          type: integer
        stock:
          $ref: '#/components/schemas/MerchantStock'

    CreateMerchantProductRequest:
      type: object
      required: [categoryId, title, description, mainImage, skus]
      properties:
        categoryId:
          type: integer
        title:
          type: string
        description:
          type: string
        mainImage:
          type: string
        skus:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateMerchantSkuRequest'

    CreateMerchantSkuRequest:
      type: object
      required: [specJson, price, stock]
      properties:
        specJson:
          type: object
          additionalProperties:
            type: string
        price:
          type: number
        stock:
          $ref: '#/components/schemas/CreateMerchantStockRequest'

    UpdateMerchantProductRequest:
      type: object
      required: [categoryId, title, description, mainImage, skus]
      properties:
        categoryId:
          type: integer
        title:
          type: string
        description:
          type: string
        mainImage:
          type: string
        skus:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpdateMerchantSkuRequest'

    UpdateMerchantSkuRequest:
      type: object
      required: [skuId, specJson, price]
      properties:
        skuId:
          type: integer
        specJson:
          type: object
          additionalProperties:
            type: string
        price:
          type: number

    CreateMerchantStockRequest:
      type: object
      required: [available]
      properties:
        available:
          type: integer
          minimum: 0

    MerchantProductSubmitAuditResponse:
      type: object
      properties:
        spuId:
          type: integer
        status:
          $ref: '#/components/schemas/ProductStatus'
        message:
          type: string

    BatchMerchantProductRequest:
      type: object
      required: [spuIds]
      properties:
        spuIds:
          type: array
          minItems: 1
          items:
            type: integer
          description: 要批量操作的 SPU ID 列表

    BatchMerchantProductResult:
      type: object
      properties:
        spuId:
          type: integer
        success:
          type: boolean
        status:
          $ref: '#/components/schemas/ProductStatus'
        reason:
          type: string
          description: 失败原因；成功时可为空

    BatchMerchantProductResponse:
      type: object
      properties:
        successCount:
          type: integer
        failureCount:
          type: integer
        failures:
          type: array
          description: 失败原因列表
          items:
            $ref: '#/components/schemas/BatchMerchantProductResult'
        results:
          type: array
          description: 每个 SPU 的处理结果
          items:
            $ref: '#/components/schemas/BatchMerchantProductResult'

    ErrorMessage:
      type: object
      properties:
        message:
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    ProductListResponse:
      type: object
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'

    ProductSummary:
      type: object
      properties:
        spuId:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
          nullable: true
        title:
          type: string
        mainImage:
          type: string
        minPrice:
          type: number
          format: double

    ProductDetail:
      type: object
      properties:
        spuId:
          type: integer
        categoryId:
          type: integer
        categoryName:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        skus:
          type: array
          items:
            $ref: '#/components/schemas/Sku'

    Sku:
      type: object
      properties:
        skuId:
          type: integer
        specJson:
          type: object
          additionalProperties:
            type: string
          example:
            color: 黑色
            storage: 256G
        price:
          type: number
        stock:
          type: integer

    CartItem:
      type: object
      properties:
        itemId:
          type: integer
        skuId:
          type: integer
        quantity:
          type: integer
        sku:
          $ref: '#/components/schemas/CartSkuSnapshot'

    CartSkuSnapshot:
      type: object
      properties:
        skuId:
          type: integer
        specJson:
          type: object
          additionalProperties:
            type: string
        price:
          type: number
        stock:
          type: integer
        title:
          type: string
        mainImage:
          type: string
        shopName:
          type: string

    Address:
      type: object
      properties:
        id:
          type: integer
        receiverName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
        isDefault:
          type: boolean

    CreateAddressRequest:
      type: object
      required: [receiverName, phone, province, city, district, detail]
      properties:
        receiverName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
        isDefault:
          type: boolean

    UpdateAddressRequest:
      type: object
      properties:
        receiverName:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        detail:
          type: string
        isDefault:
          type: boolean

    CreateOrderRequest:
      type: object
      required: [addressId, items]
      properties:
        addressId:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId:
                type: integer
              quantity:
                type: integer
        remark:
          type: string

    OrderStatus:
      type: string
      enum:
        - PENDING_PAYMENT
        - PAID
        - PENDING_SHIPMENT
        - SHIPPED
        - COMPLETED
        - CANCELLED
        - REFUNDING
        - REFUNDED

    Order:
      type: object
      properties:
        orderId:
          type: integer
        orderNo:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: number
        items:
          type: array
          items:
            type: object
            properties:
              skuId:
                type: integer
              title:
                type: string
              price:
                type: number
              quantity:
                type: integer
        createdAt:
          type: string
          format: date-time
        paymentDeadline:
          type: string
          format: date-time
          description: 待支付截止时间（创建后 15 分钟）
        canConfirmAllReceipt:
          type: boolean
          description: 全部活跃子单均为 SHIPPED 时为 true，可调用整单确认收货
        autoConfirmDeadline:
          type: string
          format: date-time
          nullable: true
          description: |
            主单维度：当前最早将自动确认的已发货子单截止时间（有 SHIPPED 子单时返回）。
            子单维度见 subOrders[].autoConfirmDeadline。
        subOrders:
          type: array
          items:
            $ref: '#/components/schemas/SubOrder'
        addressSnapshot:
          type: object
        afterSales:
          type: array
          items:
            $ref: '#/components/schemas/AfterSale'
