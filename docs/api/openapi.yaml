  # ========== Admin ==========
  /admin/admins:
    get:
      tags: [admin]
      summary: 管理员账号列表（仅 SUPER_ADMIN）
      description: 可按 role、status、keyword（用户名）筛选。SUPER_ADMIN 专用。
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/AdminRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AdminStatus'
        - name: keyword
          in: query
          schema:
            type: string
          description: 用户名模糊搜索
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAccount'
        '403':
          description: 非 SUPER_ADMIN
    post:
      tags: [admin]
      summary: 创建运营/客服管理员（仅 SUPER_ADMIN）
      description: 仅允许创建 OPERATOR 或 CS_AGENT，不可创建 SUPER_ADMIN。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '400':
          description: 参数错误或试图创建 SUPER_ADMIN
        '409':
          description: 用户名已存在

  /admin/admins/{adminId}:
    patch:
      tags: [admin]
      summary: 更新管理员（角色/状态/密码）
      description: |
        仅 SUPER_ADMIN。用户名不可改。
        角色仅允许改为 OPERATOR / CS_AGENT，不可把账号升为 SUPER_ADMIN。
        不可禁用自己；不可禁用最后一个 ACTIVE SUPER_ADMIN。
        password 省略则不修改密码。
      security:
        - bearerAuth: []
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '400':
          description: 非法操作（如禁用自己、非法角色）
        '404':
          description: 管理员不存在
    delete:
      tags: [admin]
      summary: 删除运营/客服管理员
      description: |
        仅 SUPER_ADMIN。仅可删除 OPERATOR / CS_AGENT；
        不可删除自己；不可删除 SUPER_ADMIN。
      security:
        - bearerAuth: []
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '400':
          description: 非法操作（如删除自己或超管）
        '404':
          description: 管理员不存在

