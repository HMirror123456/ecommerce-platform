openapi: 3.0.3
info:
  title: 电商平台 API
  description: |
    3 人小组项目共用接口契约。修改接口请先改本文档，再实现前后端。
    业务术语见 docs/BUSINESS_GLOSSARY.md，状态机见 docs/domain/DOMAIN_MODEL.md
    管理后台见 docs/domain/ADMIN.md
  version: 0.2.1

servers:
  - url: http://localhost:8080/api
    description: 本地开发（端口按实际后端调整）

tags:
  - name: auth
    description: 认证（用户/商家/管理员）
  - name: user
    description: C 端用户
  - name: product
    description: 商品浏览
  - name: cart
    description: 购物车
  - name: order
    description: 订单与支付
  - name: merchant
    description: 商家后台
  - name: admin
    description: 平台管理

paths:
  # ========== Auth ==========
  /auth/user/register:
    post:
      tags: [auth]
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/user/login:
    post:
      tags: [auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/merchant/login:
    post:
      tags: [auth]
      summary: 商家登录
      responses:
        '200':
          description: OK

  /auth/admin/login:
    post:
      tags: [auth]
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'

  # ========== User / Address (C端) ==========
  /addresses:
    get:
      tags: [user]
      summary: 获取当前用户收货地址列表
      description: 按默认地址优先、id 升序返回。仅本人可访问。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          description: 未登录
    post:
      tags: [user]
      summary: 新增收货地址
      description: |
        若 `isDefault=true` 或用户尚无地址，则设为默认并取消其他默认。
        下单时使用返回的 `id` 作为 `POST /orders` 的 `addressId`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 参数无效
        '401':
          description: 未登录

  /addresses/{addressId}:
    put:
      tags: [user]
      summary: 修改收货地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 参数无效
        '401':
          description: 未登录
        '404':
          description: 地址不存在
    delete:
      tags: [user]
      summary: 删除收货地址
      description: 若删除的是默认地址且仍有其他地址，将最早一条剩余地址设为默认。
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '401':
          description: 未登录
        '404':
          description: 地址不存在

  /addresses/{addressId}/default:
    put:
      tags: [user]
      summary: 设为默认收货地址
      description: 将指定地址设为默认，并取消该用户其他地址的默认状态。
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: 未登录
        '404':
          description: 地址不存在

  # ========== Product (C端) ==========
  /categories:
    get:
      tags: [product]
      summary: 商品分类树
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /products:
    get:
      tags: [product]
      summary: 商品列表（SPU）
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /products/{spuId}:
    get:
      tags: [product]
      summary: 商品详情（含 SKU 列表）
      parameters:
        - name: spuId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'

  # ========== Cart ==========
  /cart/items:
    get:
      tags: [cart]
      summary: 获取购物车
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
    post:
      tags: [cart]
      summary: 加入购物车
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'

  /cart/items/{itemId}:
    put:
      tags: [cart]
      summary: 更新数量
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
    delete:
      tags: [cart]
      summary: 删除购物车项
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content

  # ========== User Addresses ==========
  /users/addresses:
    get:
      tags: [user]
      summary: 当前用户收货地址列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags: [user]
      summary: 新增收货地址
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /users/addresses/{addressId}:
    put:
      tags: [user]
      summary: 修改收货地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    delete:
      tags: [user]
      summary: 删除收货地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content

  /users/addresses/{addressId}/default:
    patch:
      tags: [user]
      summary: 设为默认地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  # ========== Order ==========
  /orders:
    post:
      tags: [order]
      summary: 创建订单（从购物车或直接购买）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      tags: [order]
      summary: 用户订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK

  /orders/{orderId}:
    get:
      tags: [order]
      summary: 订单详情
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/pay:
    post:
      tags: [order]
      summary: Mock 支付
      description: 模拟支付成功，订单状态 PENDING_PAYMENT → PAID → PENDING_SHIPMENT
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 支付成功

  /orders/{orderId}/cancel:
    post:
      tags: [order]
      summary: 取消订单（仅待支付）
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /orders/{orderId}/after-sales:
    post:
      tags: [order]
      summary: 用户申请售后
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAfterSaleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSale'

  /orders/{orderId}/after-sales/{afterSaleId}/escalate:
    post:
      tags: [order]
      summary: 用户申请平台介入
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  # ========== Merchant ==========
  /merchant/applications:
    post:
      tags: [merchant]
      summary: 提交商家入驻申请（无需登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantApplicationSubmitRequest'
      responses:
        '201':
          description: Created
        '409':
          description: 重复申请或已入驻

  /merchant/applications/status:
    get:
      tags: [merchant]
      summary: 按手机号查询入驻申请进度（无需登录）
      parameters:
        - name: contactPhone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /merchant/dashboard/summary:
    get:
      tags: [merchant]
      summary: 商家工作台统计
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantDashboardSummary'

  /merchant/products:
    get:
      tags: [merchant]
      summary: 商家商品列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProductListResponse'
    post:
      tags: [merchant]
      summary: 创建商品（SPU+SKU）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProduct'

  /merchant/products/{spuId}/submit-audit:
    post:
      tags: [merchant]
      summary: 提交商品审核
      description: 商品状态 DRAFT → PENDING_AUDIT
      security:
        - bearerAuth: []
      parameters:
        - name: spuId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProductSubmitAuditResponse'

  /merchant/orders:
    get:
      tags: [merchant]
      summary: 商家订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK

  /merchant/orders/{subOrderId}/ship:
    post:
      tags: [merchant]
      summary: 发货
      security:
        - bearerAuth: []
      parameters:
        - name: subOrderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [logisticsCompany, trackingNo]
              properties:
                logisticsCompany:
                  type: string
                trackingNo:
                  type: string
      responses:
        '200':
          description: OK

  /merchant/after-sales:
    get:
      tags: [merchant]
      summary: 商家售后列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AfterSaleStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSaleListResponse'

  /merchant/after-sales/{afterSaleId}/audit:
    post:
      tags: [merchant]
      summary: 商家审核售后
      security:
        - bearerAuth: []
      parameters:
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfterSaleAuditRequest'
      responses:
        '200':
          description: OK

  # ========== Admin ==========
  /admin/dashboard/summary:
    get:
      tags: [admin]
      summary: 工作台待办统计
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardSummary'

  /admin/products/audits:
    get:
      tags: [admin]
      summary: 商品审核历史记录
      security:
        - bearerAuth: []
      parameters:
        - name: approved
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: 筛选通过/驳回
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAuditListResponse'

  /admin/products/pending:
    get:
      tags: [admin]
      summary: 待审核商品列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingProductListResponse'

  /admin/products/{spuId}/audit:
    post:
      tags: [admin]
      summary: 审核商品
      security:
        - bearerAuth: []
      parameters:
        - name: spuId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
      responses:
        '200':
          description: OK

  /admin/orders:
    get:
      tags: [admin]
      summary: 全平台订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
        - name: merchantId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /admin/orders/{orderId}:
    get:
      tags: [admin]
      summary: 订单详情
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'

  /admin/after-sales:
    get:
      tags: [admin]
      summary: 待仲裁售后列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSaleListResponse'

  /admin/after-sales/{afterSaleId}/arbitrate:
    post:
      tags: [admin]
      summary: 平台仲裁售后
      security:
        - bearerAuth: []
      parameters:
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArbitrateRequest'
      responses:
        '200':
          description: OK

  /admin/merchants/applications:
    get:
      tags: [admin]
      summary: 商家入驻申请列表（可按状态筛选）
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            description: PENDING / APPROVED / REJECTED / ALL，多个用逗号分隔
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantApplicationListResponse'

  /admin/merchants/pending:
    get:
      tags: [admin]
      summary: 待审核商家列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingMerchant'

  /admin/merchants/{merchantId}/audit:
    post:
      tags: [admin]
      summary: 审核商家入驻
      security:
        - bearerAuth: []
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRegisterRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password

    UserLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer

    Address:
      type: object
      description: 收货地址（对齐 DOMAIN_MODEL Address）
      properties:
        id:
          type: integer
          description: 地址 ID，下单时作为 addressId
        userId:
          type: integer
        receiverName:
          type: string
        phone:
          type: string
