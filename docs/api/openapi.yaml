openapi: 3.0.3
info:
  title: 电商平台 API
  description: |
    3 人小组项目共用接口契约。修改接口请先改本文档，再实现前后端。
    业务术语见 docs/BUSINESS_GLOSSARY.md，状态机见 docs/domain/DOMAIN_MODEL.md
    管理后台见 docs/domain/ADMIN.md
  version: 0.2.1

servers:
  - url: http://localhost:8080/api
    description: 本地开发（端口按实际后端调整）

tags:
  - name: auth
    description: 认证（用户/商家/管理员）
  - name: user
    description: C 端用户
  - name: product
    description: 商品浏览
  - name: cart
    description: 购物车
  - name: order
    description: 订单与支付
  - name: merchant
    description: 商家后台
  - name: admin
    description: 平台管理
  - name: chat
    description: 售后沟通会话（USER_CS / USER_MERCHANT）

paths:
  # ========== Auth ==========
  /auth/user/register:
    post:
      tags: [auth]
      summary: 用户注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/user/login:
    post:
      tags: [auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/merchant/login:
    post:
      tags: [auth]
      summary: 商家登录
      responses:
        '200':
          description: OK

  /auth/admin/login:
    post:
      tags: [auth]
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'

  # ========== User / Address (C端) ==========
  /users/me:
    get:
      tags: [user]
      summary: 获取当前用户资料
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: 未登录
    put:
      tags: [user]
      summary: 更新当前用户资料
      description: |
        可修改昵称；可选修改密码（需同时提供 currentPassword 与 newPassword）。
        手机号不可修改。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 参数无效
        '401':
          description: 未登录或当前密码错误

  /addresses:
    get:
      tags: [user]
      summary: 获取当前用户收货地址列表
      description: 按默认地址优先、id 升序返回。仅本人可访问。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          description: 未登录
    post:
      tags: [user]
      summary: 新增收货地址
      description: |
        若 `isDefault=true` 或用户尚无地址，则设为默认并取消其他默认。
        下单时使用返回的 `id` 作为 `POST /orders` 的 `addressId`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 参数无效
        '401':
          description: 未登录

  /addresses/{addressId}:
    put:
      tags: [user]
      summary: 修改收货地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: 参数无效
        '401':
          description: 未登录
        '404':
          description: 地址不存在
    delete:
      tags: [user]
      summary: 删除收货地址
      description: 若删除的是默认地址且仍有其他地址，将最早一条剩余地址设为默认。
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '401':
          description: 未登录
        '404':
          description: 地址不存在

  /addresses/{addressId}/default:
    put:
      tags: [user]
      summary: 设为默认收货地址
      description: 将指定地址设为默认，并取消该用户其他地址的默认状态。
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: 未登录
        '404':
          description: 地址不存在

  # ========== Product (C端) ==========
  /categories:
    get:
      tags: [product]
      summary: 商品分类树
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /products:
    get:
      tags: [product]
      summary: 商品列表（SPU）
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: keyword
          in: query
          description: 按商品标题关键词模糊搜索
          schema:
            type: string
        - name: q
          in: query
          description: keyword 的兼容别名
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /products/{spuId}:
    get:
      tags: [product]
      summary: 商品详情（含 SKU 列表）
      parameters:
        - name: spuId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'

  # ========== Favorites ==========
  /favorites:
    get:
      tags: [user]
      summary: 我的收藏列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteItem'
    post:
      tags: [user]
      summary: 收藏商品（SPU）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spuId]
              properties:
                spuId:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteItem'
        '404':
          description: 商品不存在或未上架
        '409':
          description: 已收藏

  /favorites/{spuId}:
    get:
      tags: [user]
      summary: 查询某商品是否已收藏
      security:
        - bearerAuth: []
      parameters:
        - name: spuId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  spuId:
                    type: integer
                  favorited:
                    type: boolean
    delete:
      tags: [user]
      summary: 取消收藏
      security:
        - bearerAuth: []
      parameters:
        - name: spuId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '404':
          description: 未收藏该商品

  # ========== Cart ==========
  /cart/items:
    get:
      tags: [cart]
      summary: 获取购物车
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
    post:
      tags: [cart]
      summary: 加入购物车
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, quantity]
              properties:
                skuId:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'

  /cart/items/{itemId}:
    put:
      tags: [cart]
      summary: 更新数量
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
    delete:
      tags: [cart]
      summary: 删除购物车项
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content

  # ========== User Addresses ==========
  /users/addresses:
    get:
      tags: [user]
      summary: 当前用户收货地址列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
    post:
      tags: [user]
      summary: 新增收货地址
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  /users/addresses/{addressId}:
    put:
      tags: [user]
      summary: 修改收货地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddressRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
    delete:
      tags: [user]
      summary: 删除收货地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content

  /users/addresses/{addressId}/default:
    patch:
      tags: [user]
      summary: 设为默认地址
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'

  # ========== Order ==========
  /orders:
    post:
      tags: [order]
      summary: 创建订单（从购物车或直接购买）
      description: |
        创建成功后，将从当前用户购物车中移除本次下单涉及的 SKU。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      tags: [order]
      summary: 用户订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: OK

  /orders/{orderId}:
    get:
      tags: [order]
      summary: 订单详情
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}/pay:
    post:
      tags: [order]
      summary: Mock 支付
      description: 模拟支付成功，订单状态 PENDING_PAYMENT → PAID → PENDING_SHIPMENT
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 支付成功

  /orders/{orderId}/cancel:
    post:
      tags: [order]
      summary: 取消订单（仅待支付）
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /orders/{orderId}/confirm-receipt:
    post:
      tags: [order]
      summary: 整单确认收货
      description: |
        仅当全部活跃子单均为已发货（SHIPPED）时可操作，将各 SHIPPED 子单与主单置为 COMPLETED。
        若仍有子单未发货，请改用按子单确认收货接口。
        领域：SubOrder SHIPPED → COMPLETED；主单全部完成后聚合为 COMPLETED。
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 确认成功，返回更新后的订单
        '404':
          description: 订单不存在
        '409':
          description: 仍有子单未发货或状态不允许确认收货

  /orders/{orderId}/sub-orders/{subOrderId}/confirm-receipt:
    post:
      tags: [order]
      summary: 按子单确认收货
      description: |
        用户确认某一店铺（子单）已收货。仅该子单为 SHIPPED 时可操作。
        子单 → COMPLETED 后按规则聚合主单：全部活跃子单 COMPLETED 时主单才 COMPLETED。
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: subOrderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 确认成功，返回更新后的订单
        '404':
          description: 订单或子单不存在
        '409':
          description: 子单状态不允许确认收货

  /orders/{orderId}/after-sales:
    post:
      tags: [order]
      summary: 用户申请售后（按 SKU，支持一单多笔）
      description: |
        选择同一子单下的一个或多个 SKU 申请售后。
        每个 SKU 的 quantity 须为剩余可售后整件数量。
        同一订单可多次申请，只要 SKU 仍有剩余可售后数量。
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAfterSaleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSale'
        '400':
          description: 参数无效或数量不合法
        '409':
          description: 状态不允许或 SKU 可售后数量不足

  /orders/{orderId}/after-sales/{afterSaleId}/escalate:
    post:
      tags: [order]
      summary: 用户申请平台介入
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK

  /orders/{orderId}/after-sales/{afterSaleId}/return:
    post:
      tags: [order]
      summary: 用户填写退货寄回物流（APPROVED → RETURNING）
      description: 仅 RETURN_REFUND 且 status=APPROVED 时可调用
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
        - name: afterSaleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnShipmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterSale'
        '409':
          description: 当前状态不允许寄回

  # ========== Merchant ==========
  /merchant/applications:
    post:
      tags: [merchant]
      summary: 提交商家入驻申请（无需登录）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantApplicationSubmitRequest'
      responses:
        '201':
          description: Created
        '409':
          description: 重复申请或已入驻

  /merchant/applications/status:
    get:
      tags: [merchant]
      summary: 按手机号查询入驻申请进度（无需登录）
      parameters:
        - name: contactPhone
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /merchant/dashboard/summary:
    get:
      tags: [merchant]
      summary: 商家工作台统计
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantDashboardSummary'

  /merchant/products:
    get:
      tags: [merchant]
      summary: 商家商品列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: 每页数量
        - name: keyword
          in: query
          schema:
            type: string
          description: 搜索商品标题、商品 ID、类目 ID 或类目名称
        - name: q
          in: query
          schema:
            type: string
          description: keyword 的兼容别名
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProductStatus'
          description: 商品状态筛选
        - name: categoryId
          in: query
          schema:
            type: integer
          description: 类目筛选；传父类目时包含其子类目
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProductListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    post:
      tags: [merchant]
      summary: 创建商品（SPU+SKU）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantProduct'

  /merchant/products/batch-submit-audit:
    post:
      tags: [merchant]
      summary: 批量提交商品审核
      description: 仅 DRAFT、REJECTED、OFF_SHELF 状态商品可提交审核；每个商品都会校验归属当前商家并返回成功/失败明细。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchMerchantProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMerchantProductResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /merchant/products/batch-off-shelf:
    post:
      tags: [merchant]
      summary: 批量下架商品
      description: 仅 ON_SHELF 状态商品可下架；每个商品都会校验归属当前商家并返回成功/失败明细。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
